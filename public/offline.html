<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4F46E5" />
  <title>Sem ligação — Delegatus</title>
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 380px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 20px; line-height: 1.5; }
    button {
      min-height: 44px;
      padding: 0 20px;
      border: none;
      border-radius: 12px;
      background: #4f46e5;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Estás sem ligação à internet</h1>
    <p>A Delegatus precisa de ligação para sincronizar os dados mais recentes da tua turma.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
